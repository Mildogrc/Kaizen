[package]
name = "kaizen-server"
description = "Kaizen HTTP server: API, auth, AI gateway, integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kaizen"
path = "src/main.rs"

[dependencies]
kaizen-core = { path = "../kaizen-core" }
aes-gcm = "0.11.1"
anyhow.workspace = true
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono.workspace = true
chrono-tz.workspace = true
dotenvy = "0.15.7"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
regex.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli", "query", "form", "http2", "charset"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "json", "migrate", "macros", "derive"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-br", "compression-gzip", "trace", "set-header", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url.workspace = true
uuid = { version = "1.29.0", features = ["v4", "v7"] }
